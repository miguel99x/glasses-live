# Compiles the app on a cloud Mac without signing it.
# Needs no Apple account or secrets - use it to catch code errors first.
name: Build check

on:
  push:
    paths-ignore:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        env:
          BUNDLE_ID: com.example.glasseslive
          APPLE_TEAM_ID: ""
        run: xcodegen generate

      - name: Compile (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project GlassesLive.xcodeproj \
            -scheme GlassesLive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|unavailable)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
