# XcodeGen spec. The cloud build runs `xcodegen generate` to turn this into
# GlassesLive.xcodeproj, so no Mac is needed to edit the project.
#
# BUNDLE_ID and APPLE_TEAM_ID come from environment variables at generate time
# (set as GitHub Actions secrets). Defaults keep the compile-check job working.
name: GlassesLive

options:
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Developer Mode in the Meta AI app accepts "0" (skips attestation).
    # Replace with your real IDs from the Wearables Developer Center later.
    META_APP_ID: "0"
    CLIENT_TOKEN: ""

packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    exactVersion: 2.3.0

targets:
  GlassesLive:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Sources
        excludes:
          - Info.plist
          - GlassesLive.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/GlassesLive.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
